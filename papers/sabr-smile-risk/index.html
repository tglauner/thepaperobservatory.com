        <h1>Managing Smile Risk</h1>
        <p>Hagan, Kumar, Lesniewski, and Woodward introduce SABR as a stochastic-volatility model for describing and managing implied-volatility smile dynamics. The paper's central comparison is not just which model fits today's smile, but how that smile moves when the forward rate changes.</p>
